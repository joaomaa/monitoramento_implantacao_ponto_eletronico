<div style="flex:none;min-height:46px;box-sizing:border-box;padding:0 16px;display:grid;grid-template-columns:250px minmax(0,1fr) 60px;column-gap:12px;align-items:center;border-bottom:1px solid #EDF1F6">
              <span style="font-size:12px;line-height:15px;color:#0F2A47">{{nome}}</span>
              <div role="img" aria-label="{{ativos}} com cadastro confirmado, {{pendentes}} sem confirmação" style="height:16px;display:flex;gap:2px;border-radius:3px;overflow:hidden"><div style="width:{{percentual_barra}}%;background:#1A9BBF"></div><div style="width:{{restante}}%;background:#E8590C"></div></div>
              <span style="font-size:14px;font-weight:700;text-align:right;color:#B8400A">{{pendentes}}</span>
            </div>
