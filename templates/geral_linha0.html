<div style="height:46px;flex:none;box-sizing:border-box;padding:0 16px;display:grid;grid-template-columns:220px 56px minmax(0,1fr) 64px 52px;column-gap:10px;align-items:center;border-bottom:1px solid #EDF1F6">
              <span style="font-size:12px;line-height:15px;color:#0F2A47">{{nome}}</span>
              <span style="font-size:13px;text-align:right;color:#0F2A47">{{total}}</span>
              <div style="height:14px;display:flex;border-radius:3px;overflow:hidden" role="img" aria-label="{{ativos}} com cadastro confirmado, {{pendentes}} sem confirmação"><div style="flex:none;width:{{percentual_barra}}%;background:#1A9BBF"></div><div style="flex:none;width:{{restante}}%;background:#E8590C"></div></div>
              <span style="font-size:14px;font-weight:700;text-align:right;color:#B8400A">{{pendentes}}</span>
              <span style="font-size:13px;text-align:right;color:#0F2A47">{{percentual}}</span>
            </div>
